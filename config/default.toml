[polymarket]
clob_url = "https://clob.polymarket.com"
gamma_url = "https://gamma-api.polymarket.com"
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
chain_id = 137
# JSON-RPC endpoint for the startup allowance check. Override with your own
# provider URL (e.g. Alchemy/Infura) if the public RPC rate-limits you.
polygon_rpc_url = "https://polygon-rpc.com"

[execution]
# Explicit opt-in. Set to "live" only when you're ready to send authenticated requests.
mode = "dry_run"

[strategy]
min_net_spread = "0.005"
base_fee_rate = "0.0"
max_price_staleness_ms = 2000
use_fok_orders = true
mode = "simultaneous"
max_sweep_levels = 5
min_sweep_profit_usdc = "0.50"
asymmetric_target_total_cost = "0.97"
max_unpaired_hold_secs = 3600
max_unpaired_exposure_usdc = "200.0"
max_unpaired_legs_per_market = 3
# Maximum loss (USDC) the auto-unwinder may realize on a single stale
# leg. If the projected loss at the opposite-side bid exceeds this, the
# unwinder logs an alert and leaves the leg for the operator to handle
# manually. Set to 0 to disable auto-unwind entirely.
unwind_max_loss_usdc = "5.0"

[risk]
max_order_size_usdc = "50.0"
max_total_exposure_usdc = "500.0"
min_reserve_balance_usdc = "50.0"
per_market_cooldown_secs = 10
max_concurrent_positions = 10
max_unpaired_exposure_usdc = "200.0"
max_unpaired_per_market_usdc = "50.0"

[scanner]
refresh_interval_secs = 300
max_markets = 200
min_liquidity_usdc = "100.0"

[monitor]
use_websocket = true
poll_interval_ms = 2000
max_concurrent_requests = 20
# How often the bot polls the CLOB for status updates on resting (GTC) leg
# orders. Smaller = faster pairing reaction, more API calls.
resting_order_poll_interval_secs = 10

[logging]
level = "info"
json_output = false

[telemetry]
# When true, the bot records activity (opportunities, dry-runs, fills) and
# periodic state snapshots to Supabase so the dashboard can visualize them.
# Requires SUPABASE_URL and SUPABASE_SERVICE_KEY in the environment (.env).
enabled = false
